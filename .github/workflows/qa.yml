name: CDav QA

on:
  push:
    branches: [master, '23.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calendar-http:
    name: Calendar clients over HTTP / MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CDav
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: module
          persist-credentials: false
      - name: Checkout Dolibarr 24.0.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Dolibarr/dolibarr
          ref: 769c7db907099643558e77d7002c109cfda919e5
          path: dolibarr
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, mysqli, xml, xmlreader, xmlwriter
          coverage: none
      - name: Install private database tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mariadb-server-core mariadb-client rsync
      - name: Install disposable Dolibarr and run calendar client scenarios
        working-directory: module
        env:
          DOLIBARR_ROOT: ${{ github.workspace }}/dolibarr/htdocs
        run: bash tests/ci-calendar-http.sh
  duplication:
    name: Production duplication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout CDav
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned development scanner
        run: npm install --prefix "$RUNNER_TEMP/cdav-jscpd" --no-audit --no-fund --ignore-scripts --save-exact jscpd@5.4.3
      - name: Reject production clones and report test duplication
        env:
          CDAV_JSCPD_BIN: ${{ runner.temp }}/cdav-jscpd/node_modules/.bin/jscpd
        run: |
          bash tests/duplication.sh
          bash tests/duplication.sh tests
      - name: Keep duplication reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: duplication-reports
          path: dist/qa/duplication/
          retention-days: 14
          if-no-files-found: error
  regression:
    name: Dolibarr ${{ matrix.dolibarr }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dolibarr: ['23.0.4', '24.0.0', '24.0.4 (pre-release)']
        include:
          - dolibarr: '23.0.4'
            core-ref: cb82037066c1c71f7c867482e9e92975222dfc14
          - dolibarr: '24.0.0'
            core-ref: 769c7db907099643558e77d7002c109cfda919e5
          # The official 24.0 branch declares 24.0.4 at this revision.
          - dolibarr: '24.0.4 (pre-release)'
            core-ref: f747b0d6f5ba79b6b3cb85434ceda6d3de204710
    steps:
      - name: Checkout CDav
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: module
          persist-credentials: false
      - name: Checkout native Dolibarr dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Dolibarr/dolibarr
          ref: ${{ matrix.core-ref }}
          path: dolibarr
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, xml, xmlreader, xmlwriter
          coverage: none
          tools: phpcs:3.13.5
      - name: Ensure ripgrep is available for lint enumeration
        run: |
          if ! command -v rg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ripgrep
          fi
      - name: Lint, regression tests and native Dolibarr coding standard
        working-directory: module
        env:
          DOLIBARR_ROOT: ${{ github.workspace }}/dolibarr/htdocs
          CDAV_PHPCS_STANDARD: ${{ github.workspace }}/dolibarr/dev/setup/codesniffer/ruleset.xml
        run: bash tests/qa.sh
